    :root:not([data-theme="light"]) {
      --ink: #eef3f1; --ink-soft: #aebfc2; --paper: #0b2129; --paper-dim: #102a33;
      --card: #12313b; --line: rgba(238, 243, 241, 0.14);
      --accent: #4fce93; --accent-soft: #2a6b4c; --accent-wash: rgba(79, 206, 147, 0.14);
      --amber: #e0a94f; --amber-wash: rgba(224, 169, 79, 0.14);
      --plum: #b596e0; --plum-wash: rgba(181, 150, 224, 0.14);
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef3f1; --ink-soft: #aebfc2; --paper: #0b2129; --paper-dim: #102a33;
    --card: #12313b; --line: rgba(238, 243, 241, 0.14);
    --accent: #4fce93; --accent-soft: #2a6b4c; --accent-wash: rgba(79, 206, 147, 0.14);
    --amber: #e0a94f; --amber-wash: rgba(224, 169, 79, 0.14);
    --plum: #b596e0; --plum-wash: rgba(181, 150, 224, 0.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding-inline: 20px; padding-block: 44px 90px; }

  header.masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 24px; flex-wrap: wrap; border-bottom: 2px solid var(--ink);
    padding-bottom: 20px; margin-bottom: 20px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin: 0 0 6px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 5vw, 38px);
    line-height: 1.08; margin: 0; text-wrap: balance;
  }
  .masthead-meta { text-align: right; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .masthead-meta strong { color: var(--ink); }

  .intro { font-size: 15px; color: var(--ink-soft); max-width: 64ch; line-height: 1.6; margin: 4px 0 28px; }

  .progress-bar-track {
    height: 8px; border-radius: 999px; background: var(--paper-dim);
    overflow: hidden; margin-bottom: 6px;
  }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
  .progress-label {
    display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft);
    margin-bottom: 40px; font-variant-numeric: tabular-nums;
  }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); margin-bottom: 36px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  section.category { margin-bottom: 44px; }
  .category-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .category-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0; }
  .category-count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .item-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .item {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start;
    padding: 15px 4px; border-bottom: 1px solid var(--line);
  }
  .item.is-checked .item-title { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }

  .checkbox-btn {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line);
    background: var(--card); cursor: pointer; padding: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .checkbox-btn:hover { border-color: var(--accent); }
  .checkbox-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .checkbox-btn.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox-btn svg { width: 13px; height: 13px; display: none; }
  .checkbox-btn.checked svg { display: block; }

  .item-title { font-weight: 600; font-size: 14.5px; margin: 0 0 4px; }
  .item-note { font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 0; max-width: 58ch; }

  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; margin-top: 1px;
  }
  .pill.done { background: var(--accent-wash); color: var(--accent); }
  .pill.action { background: var(--amber-wash); color: var(--amber); }
  .pill.pro { background: var(--plum-wash); color: var(--plum); }

  footer {
    border-top: 1px solid var(--line); padding-top: 18px; margin-top: 20px;
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.6;
  }

  @media (max-width: 560px) {
    .masthead-meta { text-align: left; }
    header.masthead { flex-direction: column; align-items: flex-start; }
    .item { grid-template-columns: 24px 1fr; }
    .pill { grid-column: 2; margin-top: 6px; justify-self: start; }
  }
</style>

    "  }\n" +

  function persist() {

      HEAD_HTML + "\n" +
